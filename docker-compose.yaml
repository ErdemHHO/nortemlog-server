services:
  postgres:
    image: postgres:17-alpine
    container_name: northemlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-northemlog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-northemlog_secret}
      POSTGRES_DB: ${DB_NAME:-northemlog_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-northemlog} -d ${DB_NAME:-northemlog_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
